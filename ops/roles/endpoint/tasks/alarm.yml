---
- name: Inspect the endpoint coordinator configuration
  ansible.builtin.stat:
    path: /etc/cortex-endpoint/coordinator-url
  register: endpoint_alarm_coordinator_url

- name: Require a configured endpoint before installing alarm support
  ansible.builtin.assert:
    that: endpoint_alarm_coordinator_url.stat.isreg | default(false)
    fail_msg: The endpoint coordinator URL is not configured.

- name: Install the endpoint alarm player
  ansible.builtin.apt:
    name: mpg123
    install_recommends: false
    update_cache: true
    state: present

- name: Create endpoint alarm directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
    state: directory
  loop:
    - {path: /var/lib/cortex-endpoint, owner: root, group: root, mode: "0755"}
    - {path: /var/lib/cortex-endpoint/alarm-audio, owner: imac, group: cortex-endpoint, mode: "0750"}
    - {path: /home/cortex-endpoint/.config, owner: cortex-endpoint, group: cortex-endpoint, mode: "0700"}

- name: Install endpoint alarm runtime files
  ansible.builtin.copy:
    src: "{{ cortex_project_root }}/endpoint/imac/files/{{ item.source }}"
    dest: "{{ item.destination }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - {source: cortex-endpoint-alarm, destination: /usr/local/bin/cortex-endpoint-alarm}
    - {source: cortex-endpoint-rtc-suspend, destination: /usr/local/bin/cortex-endpoint-rtc-suspend}
    - {source: cortex-airplay-control, destination: /usr/local/bin/cortex-airplay-control}
    - {source: cortex-endpoint-session, destination: /usr/local/bin/cortex-endpoint-session}
  notify: Restart endpoint kiosk

- name: Install the command-specific suspend sudo policy
  ansible.builtin.copy:
    src: "{{ cortex_project_root }}/endpoint/imac/files/cortex-endpoint-rtc-suspend.sudoers"
    dest: /etc/sudoers.d/cortex-endpoint-rtc-suspend
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo --check --file=%s
  notify: Restart endpoint kiosk
